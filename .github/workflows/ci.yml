name: CI

on:
  push:
    branches: [main, stable-release, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main, stable-release, master]
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC — weekly hygiene baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      # Tests run through a transpiler that erases types, and the build excludes
      # test sources, so this is the only step that reads a test's types. A test
      # whose claim is that a typed literal is admitted by the contract it names
      # is checked here and nowhere else.
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # Gates that are scripts, not tests. The limits verifier holds the
      # provider-limits config and the two route tables to one another. The
      # client verifier holds the LLM barrel to what it must reach and may
      # import, typechecks what it reaches, and reads the build output for
      # declarations of test-only sources, so it runs after Build.
      - name: Verify provider limits
        run: node scripts/verify-provider-limits.mjs
      - name: Verify LLM client build
        run: node scripts/verify-llm-client-build.mjs
