name: CI

on:
  push:
    branches: [stable-release, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [stable-release, master]
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC — weekly hygiene baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
